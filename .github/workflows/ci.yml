name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'member-*/**'
      - 'member-*'
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-lint-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint with Ruff
        run: |
          ruff check backend/ --exit-non-zero-on-fix || true

      - name: Run Backend Integration Tests
        run: |
          cd backend && python -m pytest tests/ -v --tb=short || true

  frontend-lint-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            cd frontend && npm install
          fi

      - name: Lint Frontend
        run: |
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            cd frontend && (npm run lint || true)
          fi

      - name: Build Frontend
        run: |
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            cd frontend && (npm run build || true)
          fi

  docker-validate:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          touch .env
          docker compose config
